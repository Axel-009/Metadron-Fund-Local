# Weekly Kronos forecasts on CPU (no GPU). Saturday 10:00 UTC.
name: kronos-weekly
on:
  schedule: [{cron: "0 10 * * 6"}]
  workflow_dispatch:
jobs:
  kronos:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QC_USER_ID: ${{ secrets.QC_USER_ID }}
      QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
      QC_ORG_ID: ${{ secrets.QC_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r vendor/Kronos/requirements.txt -r agents/requirements.txt
      - run: python agents/kronos_agent.py
