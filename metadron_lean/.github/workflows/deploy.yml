# Pushes algorithm/ to the QuantConnect project and starts a backtest after tests pass.
# Live trading is switched to a new version by the owner in QuantConnect (one click) — never from here.
name: deploy-to-quantconnect
on:
  push:
    branches: [main]
    paths: ["algorithm/**"]
  workflow_dispatch:
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python agents/qc_deploy.py --backtest --name "deploy ${{ github.sha }}"
        env:
          QC_USER_ID: ${{ secrets.QC_USER_ID }}
          QC_API_TOKEN: ${{ secrets.QC_API_TOKEN }}
          QC_PROJECT_ID: ${{ secrets.QC_PROJECT_ID }}
